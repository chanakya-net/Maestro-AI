name: Runtime tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-python:
    name: Native Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.15']
    runs-on: ${{ matrix.os }}
    # Windows venv and subprocess integration tests can exceed 15 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24'
      - name: Install package and native test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Native CLI and cutover contracts
        run: python -m pytest tests/contracts/test_cli.py tests/contracts/test_python_cutover.py -q
      - name: Native suite, artifact contents, and outside-checkout installation
        run: python -m pytest -q --basetemp=.pytest-runtime
      - name: Preserve fixture state when native validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.os }}-${{ matrix.python }}
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: true
          path: |
            .pytest-runtime/**/worker*.json
            .pytest-runtime/**/main-state.json
            .pytest-runtime/**/report.json
            .pytest-runtime/**/merge-recovery-report.json
            .pytest-runtime/**/*.log
