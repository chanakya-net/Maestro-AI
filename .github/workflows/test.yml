name: Runtime tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-python:
    name: Native Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install opt-in package and native test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Frozen CLI and entrypoint contracts
        run: python -m pytest tests/contracts/test_cli.py tests/contracts/test_contract_inventory.py -q
      - name: Native suite, artifact contents, and outside-checkout installation
        run: python -m pytest -q

  legacy-bash:
    name: Temporary legacy Bash regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all 31 legacy scenario groups with fake providers
        shell: bash
        run: |
          failed=0
          for suite in tests/*.test.sh; do
            echo "Running ${suite}"
            bash "${suite}" || failed=1
          done
          exit "${failed}"
